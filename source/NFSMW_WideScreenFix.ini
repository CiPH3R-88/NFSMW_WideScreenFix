[DISPLAY]
ResX = 0
ResY = 0
WindowMode = 0                                 ; 0 = Fullscreen | 1 = Borderless | 2 = Border | 3 = Resizable Border | 4 = Borderless Fullscreen | 5 = Borderless Fullscreen Stretched

[HUD]
FixHUD = 1                                     ; 0 = Game Default | 1 = Correct HUD aspect ratio and element positioning
WideScreenHUD = 1                              ; 0 = Game Default | 1 = Move selected HUD groups/minimap toward widescreen edges
SplashScreen = 0                               ; 0 = Auto | 1 = MW_LS_Splash.fng (4:3) | 2 = WS_MW_LS_Splash.fng (Widescreen)

[MOVIES]
WideScreenMovie = 1                            ; 0 = Game Default | 1 = Zoom/Fill 16:9 | 2 = Fit with Pillarboxes
MovieType = 0                                  ; 0 = Auto-detect | 1 = NTSC (_ntsc) | 2 = PAL (_pal)
SkipIntro = 0                                  ; 0 = Off | 1 = Skip EA logos and intro movies on startup

[GRAPHICS]
MotionBlur = 1                                 ; 0 = Off | 1 = on
ConsoleGamma = 0                               ; 0 = Off | 1 = ConsoleGamma | 2 = MWGamma (Enable this if you're a fool)
GPUVendor = 1                                  ; 0 = Off | 1 = Nvidia | 2 = AMD | 3 = Intel
SimRate = 1                                    ; 0 = Off | 1 = Dynamic (Default) | 2 = Fixed 200Hz | > 2 = Custom Hz (e.g. 144, 240)

[SHADOW]
ShadowsRes = 2048                              ; Controls the resolution of dynamic shadows and enables them for Intel GPUs. (1024 = Original | 2048 = Xbox 360 | 16384 = Max)
ShadowsFix = 1                                 ; Dynamic shadows will no longer disappear when going into tunnels, under bridges, etc.
ImproveShadowLOD = 1                           ; Increases the level of detail of dynamic shadows. This may negatively affect performance.
AutoScaleShadowsRes = 1                        ; Adjusts the specified ShadowsRes based on the user's aspect ratio to maintain quality. This may negatively affect performance.
ShadowMapTextureFormat = 0                     ; Set the texture format for the shadow map texture here. (-1 = Disable | 0 = D24S8 (Default) | 1 = INTZ | 2 = DF16 | 3 = DF24)
ForceSharpShadows = 0                          ; Forces the shadows to be sharp in texture formats that force soft shadows (INTZ, DF16 and DF24). This will cause more visible shadow pop-in, but result in much sharper stencil shadows.

[MISC]
WriteSettingsToFile = 1                        ; 1 = Store game registry settings in local file
CustomUserFilesDirectoryInGameDir = 0          ; 0 = disable, or folder name in game directory (e.g. SAVE)
Win Cursor = 0                                 ; 0 = In-game cursor (Default) | 1 = Windows OS cursor

[NOS TRAIL]
NosTrail = 1                                   ; 0 = Off | 1 = Enabled (Default)
NOSTrailLength = 1                             ; 0 = Default set by game | Values > 0 scale trail length directly
NOSTrailPositionScalar = 0.1                   ; 0 = Default (no offset) | Values > 0 offset trail position relative to tail lights
